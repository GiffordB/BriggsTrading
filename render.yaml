services:
  - type: web
    name: briggstrading-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: QUIVER_API_TOKEN
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: DRY_RUN
        value: "true"
      - key: CONFIRM_LIVE_TRADING
        sync: false
      - key: LOOKBACK_DAYS
        value: "7"
      - key: TRADING_HALTED
        value: "false"
      - key: MAX_DRAWDOWN_PCT
        value: "0.15"
      - key: MAX_POSITION_CONCENTRATION_PCT
        value: "0.20"
      - key: MAX_PORTFOLIO_EXPOSURE_PCT
        value: "0.75"
      - key: NEWS_LOOKBACK_DAYS
        value: "5"
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
